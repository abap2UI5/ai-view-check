name: 'abap2UI5-linter'
description: 'Validate abap2UI5 views: UI5 version/deprecation property gate + headless render smoke — no SAP system needed.'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  paths:
    description: 'Files or directories to check (space-separated)'
    required: false
    default: 'src'
  min-ui5:
    description: 'UI5 floor for the property gate'
    required: false
    default: '1.71'
  fail-on:
    description: 'Lowest severity that fails the job: error, warning, hint or never'
    required: false
    default: 'warning'
  flags:
    description: 'Extra CLI flags, e.g. "--no-render --allow sap.m.Avatar.displaySize"'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install abap2UI5-linter
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}"
    - name: Install Chromium
      shell: bash
      run: npx --prefix "${{ github.action_path }}" playwright install chromium --with-deps
    - name: Run abap2UI5-linter
      shell: bash
      run: node "${{ github.action_path }}/cli.mjs" ${{ inputs.paths }} --min-ui5 "${{ inputs['min-ui5'] }}" --fail-on "${{ inputs['fail-on'] }}" ${{ inputs.flags }}
