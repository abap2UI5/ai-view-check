name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      # the metadata drift gate: a change to generate-metadata.mjs without a
      # regenerated data/properties.json must not merge silently. Its own CI
      # step (not part of npm test) because the full parse takes ~3 minutes.
      - run: npm run generate-metadata -- --check
