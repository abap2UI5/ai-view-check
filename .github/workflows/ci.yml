name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # npm test includes the metadata drift gate (generate-metadata --check):
      # ~2s since the extend-scan fix, so it no longer needs its own step
      - run: npm test
